<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href`. -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <!-- No network egress: the page may only talk to its own origin. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; worker-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Private, offline photo effects. Runs entirely on your device.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Photo Effects">
  <meta name="theme-color" content="#1c1b1f">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Photo Effects</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1c1b1f; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
              justify-content: center; color: #e6e1e5; font: 15px -apple-system, system-ui, sans-serif; }
    #splash img { width: 96px; height: 96px; border-radius: 22px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-192.png" alt=""><div>Loading Photo Effects...</div></div>
  <script src="register_sw.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
